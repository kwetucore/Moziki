server:
  port: ${MOZIKI_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: moziki-backend
  datasource:
    url: ${MOZIKI_DB_URL:jdbc:postgresql://127.0.0.1:5434/moziki}
    username: ${MOZIKI_DB_USER:moziki}
    password: ${MOZIKI_DB_PASSWORD:moziki}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

moziki:
  health:
    events:
      retention-days: ${MOZIKI_HEALTH_EVENTS_RETENTION_DAYS:30}
  jwt:
    # MUST be overridden in every deployed environment (32+ bytes for HS256).
    secret: ${MOZIKI_JWT_SECRET:dev-only-insecure-secret-please-change-0123456789abcdef}
    ttl-minutes: ${MOZIKI_JWT_TTL_MINUTES:480}
  cors:
    allowed-origins: ${MOZIKI_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  demo-data:
    enabled: ${MOZIKI_DEMO_DATA:true}
    password: ${MOZIKI_DEMO_PASSWORD:Moziki2026!}
  ledger:
    # Coop currency is currently single-currency. Multi-currency is a later phase.
    currency: CDF
  reconciliation:
    # A completed day stays open until this local hour the following morning,
    # then locks automatically. Today is always open.
    lock-hour: ${MOZIKI_RECONCILIATION_LOCK_HOUR:12}
    # Absolute ceiling; the end-of-day lock can only be stricter than this.
    max-backfill-days: ${MOZIKI_RECONCILIATION_BACKFILL_DAYS:7}
    # Photo/receipt evidence. Use a shared volume or object storage in production.
    evidence-dir: ${MOZIKI_EVIDENCE_DIR:./data/evidence}
    evidence-max-bytes: ${MOZIKI_EVIDENCE_MAX_BYTES:5242880}

logging:
  level:
    cd.moziki: INFO
    org.flywaydb: INFO
